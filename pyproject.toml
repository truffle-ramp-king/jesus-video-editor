[project]
name = "jesus-video-editor"
version = "1.0.0"
description = "Cut visual Bible stories with Gemini, timestamped transcripts, and FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2",
    "elevenlabs>=1.0.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "scenedetect>=0.7",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.scripts]
jesus-video-edit = "trailer_editor.cli:main"
trailer-edit = "trailer_editor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailer_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
